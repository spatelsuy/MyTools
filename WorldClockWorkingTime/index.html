<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overlap: Time Zone Planner | SPBasic Tools</title>
<meta name="description" content="Compare time zones, find daylight and working-hours overlap, and plan meetings across the world. Runs in your browser, no installs or sign-ups.">

<!-- Favicons & App Icons -->
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="/WorldClockWorkingTime/style.css">
<script src="../header.js"></script>
</head>
<body>
<site-header root="../" active="tools"></site-header>

<div class="wrap">
  <div class="hero">
    <div>
      <small>Your local time</small>
      <div class="big" id="big">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="nav">
      <button id="prev" class="navbtn" aria-label="Previous day">&#8249;</button>
      <input type="date" id="goto" aria-label="Go to date">
      <button id="next" class="navbtn" aria-label="Next day">&#8250;</button>
      <button id="live" class="on">Live</button>
    </div>
  </div>

  <div class="clocks" id="clocks" aria-label="Current time in each selected zone"></div>

  <div id="app"></div>
</div>

<script src="/WorldClockWorkingTime/app.js"></script>
</body>
</html>
